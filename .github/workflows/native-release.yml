name: Native release

on:
  push:
    tags: ["native-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Native release version, without native-v
        required: true

permissions:
  contents: write

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runner: macos-26 }
          - { target: macos-x64, runner: macos-26 }
          - { target: ios-device-arm64, runner: macos-26 }
          - { target: ios-simulator-arm64, runner: macos-26 }
          - { target: ios-simulator-x64, runner: macos-26 }
          - { target: android-arm64, runner: ubuntu-26.04 }
          - { target: android-arm, runner: ubuntu-26.04 }
          - { target: android-x64, runner: ubuntu-26.04 }
          - { target: linux-x64, runner: ubuntu-26.04 }
          - { target: linux-arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install meson nasm ninja

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake meson nasm ninja-build

      - uses: actions/cache@v6
        with:
          path: .native-cache
          key: native-${{ matrix.target }}-${{ hashFiles('native/versions.json') }}

      - name: Build profiles
        run: |
          for profile in decode-dav1d encode-aom full-aom-aom full-dav1d-aom; do
            tool/native/build_unix.sh "${{ matrix.target }}" "$profile"
          done

      - name: Reject unexpected dynamic dependencies
        run: |
          for library in dist/${{ matrix.target }}/*/libavif_native.*; do
            case "$library" in
              *.gz) continue ;;
              *.dylib)
                ! otool -L "$library" | grep -E '/opt/homebrew|/usr/local|\.native-cache'
                ;;
              *.so)
                readelf -d "$library" 2>/dev/null || \
                  "${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$library"
                ;;
            esac
          done

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            msvc: amd64
            profiles: decode-dav1d encode-aom full-aom-aom full-dav1d-aom
          - target: windows-arm64
            runner: windows-11-arm
            msvc: arm64
            profiles: decode-dav1d
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - name: Install NASM
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          choco install nasm -y
          "C:\Program Files\NASM" | Out-File -Append $env:GITHUB_PATH
      - run: pip install meson ninja
      # dav1d's ARM assembly needs gas-preprocessor under MSVC; Git's Perl
      # runs it. Appended after MSVC so Git's coreutils cannot shadow link.exe.
      - name: Install gas-preprocessor
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          $tools = "$env:RUNNER_TEMP\gaspp"
          New-Item -ItemType Directory -Force $tools | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/FFmpeg/gas-preprocessor/ac1836309c2e77023c228b7184485597286289d3/gas-preprocessor.pl -OutFile "$tools\gas-preprocessor.pl"
          "EXTRA_PATH=$tools;C:\Program Files\Git\usr\bin" | Out-File -Append $env:GITHUB_ENV
      - uses: actions/cache@v6
        with:
          path: .native-cache
          key: native-${{ matrix.target }}-${{ hashFiles('native/versions.json') }}
      - name: Build profiles
        shell: pwsh
        run: |
          if ($env:EXTRA_PATH) { $env:PATH = "$env:PATH;$env:EXTRA_PATH" }
          foreach ($profile in '${{ matrix.profiles }}'.Split(' ')) {
            tool/native/build_windows.ps1 ${{ matrix.target }} $profile
          }
      - name: List dependencies
        shell: pwsh
        run: |
          Get-ChildItem dist/${{ matrix.target }} -Recurse -Filter avif_native.dll |
            ForEach-Object { dumpbin /DEPENDENTS $_.FullName }
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: [build-unix, build-windows]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Build release manifest
        id: version
        shell: bash
        run: |
          version='${{ inputs.version }}'
          [[ -n "$version" ]] || version="${GITHUB_REF_NAME#native-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 tool/generate_manifest.py \
            "$version" "$GITHUB_REPOSITORY" dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: native-v${{ steps.version.outputs.version }}
          files: release/*
